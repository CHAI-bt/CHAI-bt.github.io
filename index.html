<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F6FB">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0F19">
<title>Bob C.'s Page</title>
<script>
  // 在首次绘制前应用已保存的选择，避免深浅色闪变
  (function () {
    try {
      var t = localStorage.getItem('appearance');
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  })();
</script>
<style>
  :root {
    color-scheme: light dark;

    /* 浅色（默认） */
    --bg: #F4F6FB;
    --card: rgba(255, 255, 255, 0.62);
    --card-hover: rgba(255, 255, 255, 0.82);
    --ink: #10131a;
    --ink-2: rgba(28, 34, 48, 0.60);
    --line: rgba(16, 24, 40, 0.10);
    --line-hover: rgba(16, 24, 40, 0.26);
    --accent: #3b6cf6;
    --accent-soft: rgba(59, 108, 246, 0.10);
    --chev-hover: rgba(16, 24, 40, 0.85);
    --panel: rgba(255, 255, 255, 0.92);
    --hover-row: rgba(16, 24, 40, 0.06);

    --glow-1: radial-gradient(58% 46% at 16% 0%, rgba(79, 124, 255, 0.16) 0%, transparent 70%);
    --glow-2: radial-gradient(52% 42% at 90% 20%, rgba(122, 92, 255, 0.12) 0%, transparent 72%);
    --glow-3: radial-gradient(62% 48% at 28% 100%, rgba(56, 189, 248, 0.10) 0%, transparent 72%);

    --radius: 14px;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 10px 26px -14px rgba(16, 24, 40, 0.16);
    --shadow-hover: 0 2px 4px rgba(16, 24, 40, 0.07), 0 18px 40px -16px rgba(16, 24, 40, 0.22);

    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  /* 手动指定：深色 */
  :root[data-theme="dark"] {
    color-scheme: dark;

    --bg: #0B0F19;
    --card: rgba(255, 255, 255, 0.06);
    --card-hover: rgba(255, 255, 255, 0.09);
    --ink: #f2f5fa;
    --ink-2: rgba(235, 238, 245, 0.60);
    --line: rgba(255, 255, 255, 0.10);
    --line-hover: rgba(255, 255, 255, 0.30);
    --accent: #6f9bff;
    --accent-soft: rgba(111, 155, 255, 0.16);
    --chev-hover: rgba(255, 255, 255, 0.90);
    --panel: rgba(21, 26, 36, 0.92);
    --hover-row: rgba(255, 255, 255, 0.08);

    --glow-1: radial-gradient(58% 46% at 16% 0%, rgba(79, 124, 255, 0.26) 0%, transparent 70%);
    --glow-2: radial-gradient(52% 42% at 90% 20%, rgba(122, 92, 255, 0.20) 0%, transparent 72%);
    --glow-3: radial-gradient(62% 48% at 28% 100%, rgba(56, 189, 248, 0.12) 0%, transparent 72%);

    --shadow: 0 1px 1px rgba(0, 0, 0, 0.18), 0 10px 26px -14px rgba(0, 0, 0, 0.55);
    --shadow-hover: 0 2px 3px rgba(0, 0, 0, 0.22), 0 18px 40px -16px rgba(0, 0, 0, 0.70);
  }

  /* 手动指定：浅色（只修正浏览器 UI 配色） */
  :root[data-theme="light"] {
    color-scheme: light;
  }

  /* 跟随系统 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      color-scheme: dark;

      --bg: #0B0F19;
      --card: rgba(255, 255, 255, 0.06);
      --card-hover: rgba(255, 255, 255, 0.09);
      --ink: #f2f5fa;
      --ink-2: rgba(235, 238, 245, 0.60);
      --line: rgba(255, 255, 255, 0.10);
      --line-hover: rgba(255, 255, 255, 0.30);
      --accent: #6f9bff;
      --accent-soft: rgba(111, 155, 255, 0.16);
      --chev-hover: rgba(255, 255, 255, 0.90);
      --panel: rgba(21, 26, 36, 0.92);
      --hover-row: rgba(255, 255, 255, 0.08);

      --glow-1: radial-gradient(58% 46% at 16% 0%, rgba(79, 124, 255, 0.26) 0%, transparent 70%);
      --glow-2: radial-gradient(52% 42% at 90% 20%, rgba(122, 92, 255, 0.20) 0%, transparent 72%);
      --glow-3: radial-gradient(62% 48% at 28% 100%, rgba(56, 189, 248, 0.12) 0%, transparent 72%);

      --shadow: 0 1px 1px rgba(0, 0, 0, 0.18), 0 10px 26px -14px rgba(0, 0, 0, 0.55);
      --shadow-hover: 0 2px 3px rgba(0, 0, 0, 0.22), 0 18px 40px -16px rgba(0, 0, 0, 0.70);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background-color: var(--bg);
    background-image: var(--glow-1), var(--glow-2), var(--glow-3);
    background-repeat: no-repeat;
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;
  }

  .page {
    max-width: 520px;
    min-height: 100svh;
    margin: 0 auto;
    padding: clamp(64px, 10vh, 96px) 20px 32px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* ---------- 外观设置 ---------- */

  .settings {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 30;
  }

  .settings-btn {
    width: 38px;
    height: 38px;
    padding: 0;
    display: grid;
    place-items: center;
    border-radius: 11px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink-2);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: color 0.18s ease, border-color 0.18s ease, background-color 0.18s ease;
  }

  .settings-btn:hover,
  .settings-btn[aria-expanded="true"] {
    color: var(--ink);
    border-color: var(--line-hover);
    background: var(--card-hover);
  }

  .settings-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .settings-btn svg { width: 18px; height: 18px; }

  .settings-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 178px;
    padding: 8px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    box-shadow: var(--shadow-hover);
    animation: pop 0.16s var(--ease) backwards;
  }

  .settings-panel[hidden] { display: none; }

  .settings-title {
    margin: 2px 8px 6px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--ink-2);
  }

  .settings-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 8px;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
  }

  .settings-option:hover { background: var(--hover-row); }

  .settings-option input {
    width: 15px;
    height: 15px;
    margin: 0;
    accent-color: var(--accent);
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(-4px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ---------- 身份区 ---------- */

  .hero {
    text-align: center;
    margin-bottom: clamp(28px, 5vh, 44px);
    animation: rise 0.5s var(--ease) backwards;
  }

  .mark {
    display: block;
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
  }

  .hero h1 {
    margin: 0;
    font-size: clamp(28px, 7vw, 34px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }

  .tagline {
    margin: 8px 0 0;
    font-size: 15px;
    font-weight: 400;
    color: var(--ink-2);
  }

  /* ---------- 链接区 ---------- */

  .links ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    box-shadow: var(--shadow);
    color: inherit;
    text-decoration: none;
    animation: rise 0.5s var(--ease) backwards;
    animation-delay: calc(var(--i, 0) * 60ms + 100ms);
    transition: transform 0.18s var(--ease),
                border-color 0.18s ease,
                box-shadow 0.18s var(--ease),
                background-color 0.18s ease;
  }

  .link:hover {
    transform: translateY(-2px);
    background: var(--card-hover);
    border-color: var(--line-hover);
    box-shadow: var(--shadow-hover);
  }

  .link:active {
    transform: translateY(0);
  }

  .link:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-color: var(--accent);
  }

  .ico {
    flex: none;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: var(--accent-soft);
    color: var(--accent);
    transition: background-color 0.18s ease;
  }

  .ico svg {
    width: 19px;
    height: 19px;
  }

  .txt {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .t {
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  .d {
    font-size: 13.5px;
    font-weight: 400;
    color: var(--ink-2);
    overflow-wrap: break-word;
  }

  .chev {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--ink-2);
    transition: transform 0.18s var(--ease), color 0.18s ease;
  }

  .link:hover .chev,
  .link:focus-visible .chev {
    transform: translateX(3px);
    color: var(--chev-hover);
  }

  /* ---------- 页脚 ---------- */

  .foot {
    margin-top: clamp(28px, 5vh, 44px);
    text-align: center;
    font-size: 12px;
    color: var(--ink-2);
    opacity: 0.75;
  }

  /* ---------- 入场动效 ---------- */

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (min-width: 768px) {
    .page { padding-left: 24px; padding-right: 24px; }
    .link { padding: 16px 18px; gap: 16px; }
    .ico { width: 40px; height: 40px; }
    .ico svg { width: 20px; height: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hero, .link, .settings-panel {
      animation: none;
    }
    .link, .ico, .chev, .settings-btn {
      transition: none;
    }
    .link:hover { transform: none; }
  }
</style>
</head>

<script>
  // 按顺序给卡片编号，供入场错峰使用；新增 <li> 无需手动改序号
  document.querySelectorAll('.link').forEach(function (el, i) {
    el.style.setProperty('--i', i);
  });
</script>

<script>
  (function () {
    var KEY = 'appearance';
    var root = document.documentElement;
    var wrap = document.getElementById('settings');
    var btn = document.getElementById('settingsBtn');
    var panel = document.getElementById('settingsPanel');
    var radios = panel.querySelectorAll('input[name="appearance"]');

    function stored() {
      try {
        var v = localStorage.getItem(KEY);
        if (v === 'light' || v === 'dark') return v;
      } catch (e) {}
      return 'system';
    }

    function syncMeta(value) {
      var COLORS = { light: '#F4F6FB', dark: '#0B0F19' };
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
        if (value === 'light' || value === 'dark') {
          m.setAttribute('content', COLORS[value]);
        } else {
          var isDark = (m.getAttribute('media') || '').indexOf('dark') > -1;
          m.setAttribute('content', isDark ? COLORS.dark : COLORS.light);
        }
      });
    }

    function apply(value) {
      if (value === 'light' || value === 'dark') {
        root.setAttribute('data-theme', value);
      } else {
        root.removeAttribute('data-theme');
      }
      syncMeta(value);
      try { localStorage.setItem(KEY, value); } catch (e) {}
    }

    // 单选初始状态与已保存的选择对齐
    var initial = stored();
    syncMeta(initial);
    radios.forEach(function (r) { r.checked = (r.value === initial); });

    radios.forEach(function (r) {
      r.addEventListener('change', function () {
        if (r.checked) apply(r.value);
      });
    });

    function open() {
      panel.hidden = false;
      btn.setAttribute('aria-expanded', 'true');
    }
    function close() {
      panel.hidden = true;
      btn.setAttribute('aria-expanded', 'false');
    }

    btn.addEventListener('click', function () {
      if (panel.hidden) open(); else close();
    });

    document.addEventListener('click', function (e) {
      if (!panel.hidden && !wrap.contains(e.target)) close();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !panel.hidden) {
        close();
        btn.focus();
      }
    });
  })();
</script>
