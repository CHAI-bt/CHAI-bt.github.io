<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#1f2530; --muted:#6b7482;
  --line:#cbd5e1; --accent:#2563eb; --key:#b45309; --thm:#6d28d9;
  --eg:#047857; --opt:#94a3b8; --link:#ea580c;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.6 "Segoe UI","Microsoft YaHei","Source Han Sans SC",system-ui,sans-serif;
  display:flex; overflow:hidden;
}
/* ---------- sidebar ---------- */
#side{
  width:290px; min-width:290px; height:100%; overflow:auto;
  background:#111827; color:#e5e7eb; padding:16px 12px 40px;
}
#side h1{font-size:16px;margin:0 0 4px}
#side .sub{font-size:12px;color:#9ca3af;margin-bottom:12px}
#search{width:100%;padding:7px 9px;border-radius:7px;border:1px solid #374151;
  background:#1f2937;color:#f9fafb;font-size:13px}
.grp{margin-top:16px}
.grp>.gt{font-size:12px;color:#93c5fd;letter-spacing:.5px;text-transform:uppercase;
  margin:0 0 6px;font-weight:700}
.lbtn{display:flex;gap:7px;align-items:baseline;padding:5px 8px;border-radius:6px;
  cursor:pointer;font-size:13px;color:#d1d5db;line-height:1.35}
.lbtn:hover{background:#1f2937}
.lbtn.act{background:#2563eb;color:#fff}
.lbtn .pp{color:#6b7280;font-size:11px;flex:none}
.lbtn.act .pp{color:#dbeafe}
.gbtn{display:block;margin:6px 0 0;padding:7px 9px;border-radius:7px;background:#0b3b8c;
  color:#fff;font-size:13px;cursor:pointer;border:1px solid #1d4ed8}
.gbtn:hover{background:#1d4ed8}
#side .foot{margin-top:18px;font-size:11px;color:#6b7280;line-height:1.5}
/* ---------- main ---------- */
#main{flex:1;height:100%;display:flex;flex-direction:column;min-width:0}
#head{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 18px 8px;
  box-shadow:var(--shadow);z-index:5}
#head .ht{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
#head h2{font-size:19px;margin:0}
#head .file{font-size:12px;color:var(--muted);font-family:ui-monospace,Consolas,monospace}
#sum{font-size:13px;color:#374151;margin:4px 0 0;max-width:1100px}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
button.tb,select.tb{
  font-size:12px;padding:4px 9px;border-radius:6px;border:1px solid var(--line);
  background:#fff;color:var(--ink);cursor:pointer}
button.tb:hover{border-color:var(--accent);color:var(--accent)}
button.tb.on{background:var(--accent);border-color:var(--accent);color:#fff}
#bar .sp{flex:1}
#bar .lbl{font-size:12px;color:var(--muted)}
#wrap{flex:1;position:relative;overflow:auto;background:
  radial-gradient(circle at 1px 1px, #e2e8f0 1px, transparent 0) 0 0/22px 22px}
#stage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#scroller{position:absolute;top:0;left:0;pointer-events:none}
#edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
#nodes{position:absolute;top:0;left:0;width:6000px;height:6000px}
/* ---------- nodes ---------- */
.node{position:absolute;max-width:368px;padding:5px 9px;border-radius:8px;background:#fff;
  border:1px solid var(--line);box-shadow:var(--shadow);font-size:13px;line-height:1.45;
  cursor:default;transition:box-shadow .15s, transform .05s}
.node .bd{display:inline-block;font-size:10px;font-weight:700;padding:0 5px;border-radius:9px;
  margin-right:6px;vertical-align:1px;background:#eef2ff;color:#4338ca}
.node .kids{font-size:10px;color:var(--opt);margin-left:6px}
.node.root{background:#111827;color:#fff;border-color:#111827;font-size:15px;font-weight:700;max-width:250px}
.node.root .bd{background:#374151;color:#e5e7eb}
.node.sec{border-left:4px solid var(--accent);background:#f7faff;font-weight:700;max-width:290px}
.node.key{border-left:4px solid var(--key);background:#fffbf3;font-weight:700}
.node.key .bd{background:#fef3c7;color:#92400e}
.node.thm{border-left:4px solid var(--thm);background:#faf5ff}
.node.thm .bd{background:#ede9fe;color:#5b21b6}
.node.eq{font-family:ui-monospace,Consolas,"Courier New",monospace;background:#f8fafc;font-size:13px}
.node.eq .bd{background:#e2e8f0;color:#334155}
.node.eg{border-left:4px solid var(--eg);background:#f0fdf7}
.node.eg .bd{background:#d1fae5;color:#065f46}
.node.opt{border-style:dashed;color:var(--muted);background:#fafafa;border-left:4px solid var(--opt)}
.node.opt .bd{background:#f1f5f9;color:#64748b}
.node.linked{outline:2px solid var(--link);outline-offset:1px}
.node.flash{animation:fl 1.1s ease-out 2}
@keyframes fl{0%{box-shadow:0 0 0 3px rgba(234,88,12,.55)}100%{box-shadow:var(--shadow)}}
.node:hover{box-shadow:0 3px 10px rgba(16,24,40,.16)}
.node.has-k{cursor:pointer}
/* ---------- panels ---------- */
#panels{position:absolute;right:14px;top:14px;width:400px;max-height:calc(100% - 28px);
  overflow:auto;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);padding:12px 14px;font-size:13px;display:none}
#panels h3{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
#panels h3 .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}
.keys{margin-bottom:4px}
.kp{font-size:12.5px;line-height:1.5;background:#fffbeb;border:1px solid #fde68a;border-radius:7px;
  padding:5px 8px;margin-bottom:5px;color:#451a03}
.chain{border-left:3px solid var(--link);background:#fff7ed;border-radius:0 7px 7px 0;
  padding:6px 9px;margin-bottom:7px;cursor:pointer}
.chain:hover{background:#ffedd5}
.chain b{color:#9a3412}
.chain .why{color:#57534e;font-size:12px;margin-top:2px}
.chain .num{display:inline-block;width:18px;height:18px;border-radius:9px;background:var(--link);
  color:#fff;font-size:11px;text-align:center;line-height:18px;margin-right:5px;font-weight:700}
.rel .chip{display:inline-block;margin:3px 4px 0 0;padding:3px 8px;border-radius:12px;font-size:12px;
  background:#eef2ff;color:#3730a3;cursor:pointer;border:1px solid #c7d2fe}
.rel .chip:hover{background:#c7d2fe}
.rel .chip.out{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}
.rel .chip.out:hover{background:#a7f3d0}
.note{font-size:12px;color:#4b5563;background:#f8fafc;border:1px dashed var(--line);
  border-radius:7px;padding:7px 9px;margin-top:9px}
/* ---------- global view ---------- */
#global{display:none;padding:26px 30px 90px;overflow:auto;height:100%}
#global h2{font-size:22px;margin:0 0 4px}
#global p.lede{max-width:1000px;color:#374151}
#gw{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:8px;margin:16px 0;overflow:auto}
#gsvg{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:14px 18px;margin:16px 0;max-width:1180px}
.card h3{margin:0 0 10px;font-size:16px}
.step{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed #e5e7eb}
.step:last-child{border-bottom:none}
.step .n{flex:none;width:26px;height:26px;border-radius:13px;background:#111827;color:#fff;
  text-align:center;line-height:26px;font-size:12px;font-weight:700}
.step .tx{font-size:13px}
.step .tx em{font-style:normal;color:var(--muted);font-size:12px}
.step .tx .jump{color:var(--accent);cursor:pointer;text-decoration:underline dotted}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{border-bottom:1px solid #e5e7eb;padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:#f8fafc;font-size:12px;color:var(--muted)}
.tbl td.f{font-family:ui-monospace,Consolas,monospace;white-space:nowrap}
.tbl tr:hover td{background:#f9fafb}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.legend span{font-size:12px;padding:2px 8px;border-radius:11px;border:1px solid var(--line);background:#fff}
.legend i{font-style:normal;font-weight:700;margin-right:4px}
#mjwarn{display:none;position:fixed;left:14px;bottom:14px;background:#7f1d1d;color:#fee2e2;
  padding:8px 12px;border-radius:8px;font-size:12px;z-index:99;box-shadow:var(--shadow)}
@media print{
  #side,#bar,#panels,#mjwarn{display:none!important}
  body{overflow:visible;height:auto}#wrap{overflow:visible}#scroller{display:none}
}
</style>
</head>

let mjQueue=[];

setTimeout(()=>{ if(!window.__mjReady && !window.__mjFailed){ window.__mjFailed=true; const q=mjQueue; mjQueue=[]; q.forEach(f=>f()); if(S.cur) render(); } },3500);
function typeset(el){
  const els=Array.isArray(el)?el:[el];
  return new Promise(res=>{
    if(window.__mjReady && window.MathJax && MathJax.typesetPromise){
      MathJax.typesetPromise(els).then(()=>res()).catch(()=>res());
    } else if(window.__mjFailed){ res(); }
    else { mjQueue.push(res); }
  });
}
function showWarn(){ if(window.__mjFailed) $('#mjwarn').style.display='block'; }
/* 同一条公式只排版一次；来回切换讲义/折叠展开时直接复用结果 */
const MJ_CACHE=new Map();
function cachedTypeset(container, token){
  const need=[];
  container.querySelectorAll('.node .tx').forEach(sp=>{
    const raw=sp.dataset.raw||'';
    if(MJ_CACHE.has(raw)) sp.innerHTML=MJ_CACHE.get(raw);
    else if(raw.includes('$')) need.push(sp);
  });
  /* 分小批排版：每批之间让出主线程，避免切换讲义时界面卡住 */
  let idx=0;
  const step=()=>{
    if(token!==undefined && token!==RENDER_ID) return Promise.resolve();   /* 已切到别的讲义：放弃剩余批次 */
    if(idx>=need.length) return Promise.resolve();
    const batch=need.slice(idx, idx+24); idx+=24;
    return typeset(batch).then(()=>{
      batch.forEach(sp=>{ if(sp.innerHTML.includes('mjx-container')) MJ_CACHE.set(sp.dataset.raw, sp.innerHTML); });
      return new Promise(r=>setTimeout(()=>r(),0));
    }).then(step);
  };
  return step();
}

/* ================= 工具 ================= */
function walk(n, fn, d=0, par=null){ fn(n,d,par); (n.c||[]).forEach(k=>walk(k,fn,d+1,n)); }
function countNodes(n){ let s=1; (n.c||[]).forEach(k=>s+=countNodes(k)); return s; }
function visibleKids(n, d){
  if(S.collapsed.has(nid(n))) return [];
  return d>=S.depth ? [] : (n.c||[]);
}
function nid(n){ return S.cur+'::'+(n.__id||''); }
// path map is built per render
let PATH = new Map();
function buildPath(root){
  PATH=new Map();
  const rec=(n,pre)=>{ const id=pre+'/'+(n.t||'').slice(0,24); n.__id=id; PATH.set(id,n); (n.c||[]).forEach(k=>rec(k,id)); };
  rec(root,'');
}
function findNode(root, term){
  if(!term) return null;
  const nz=(s)=>s.replace(/\\/g,'').toLowerCase();
  const q=nz(term);
  let hit=null;
  walk(root,(n)=>{ if(!hit && n.t && nz(n.t).includes(q)) hit=n; });
  return hit;
}
function expandTo(target){
  // set collapsed so that target visible: walk parent chain
  const chain=[]; let cur=target;
  while(cur){ chain.push(cur.__id); cur=parentOf(cur); }
  chain.forEach(id=>S.collapsed.delete(S.cur+'::'+id));
}
function parentOf(node){
  const l=BY_ID[S.cur]; let found=null;
  walk(l.tree,(n,d,par)=>{ if(n===node) found=par; });
  return found;
}

function badge(k){

async function render(){
  const me=++RENDER_ID;

  nodesEl.innerHTML=''; edgesEl.innerHTML='';
  nodesEl.style.width='6000px'; nodesEl.style.height='6000px';   /* 测量期给足宽度，排版后收回 */
  buildPath(L.tree);
  drawPanels(L);

  /* 1) 建 DOM（绝对定位、先堆叠） */
  const items=[];
  const rec=(n,d,par)=>{
    const el=document.createElement('div');
    el.className='node '+n.k;
    const b=document.createElement('span'); b.className='bd'; b.textContent=badge(n.k);
    el.appendChild(b);
    const tx=document.createElement('span'); tx.className='tx'; tx.dataset.raw=n.t;
    tx.appendChild(document.createTextNode(n.t)); el.appendChild(tx);
    const kids = visibleKids(n,d);
    if((n.c||[]).length){
      const sp=document.createElement('span'); sp.className='kids';
      sp.textContent = S.collapsed.has(S.cur+'::'+n.__id) ? ' ＋'+(n.c.length) : ' −';
      el.appendChild(sp);
      el.classList.add('has-k');
      el.addEventListener('click',()=>{ 
        const id=S.cur+'::'+n.__id;
        if(S.collapsed.has(id)) S.collapsed.delete(id); else S.collapsed.add(id);
        render();
      });
    }
    el.dataset.id=n.__id;
    if(n.__flash){ el.dataset.flash='1'; n.__flash=false; }
    nodesEl.appendChild(el);
    n.__el=el; n.__d=d;
    items.push({n,d,par});
    kids.forEach(k=>rec(k,d+1,n));
    n.__vis=kids;
  };
  rec(L.tree,0,null);

  /* 1) 先按未排版内容即时布局一次，MathJax 排完再重排一次（避免点击卡顿） */
  const drawLayout = (force) => {
    /* 2) 测量 + 按层排布 */
    const dw={};
    items.forEach(({n})=>{ n.__w=n.__el.offsetWidth; n.__h=n.__el.offsetHeight;
      dw[n.__d]=Math.max(dw[n.__d]||0,n.__w); });
    const dx=[PAD]; for(let d=1;d<=Math.max(...items.map(i=>i.d));d++) dx[d]=dx[d-1]+dw[d-1]+GX;
    const H=(n)=>{ const k=n.__vis; if(!k.length){n.__sh=n.__h;return n.__h;} 
      let s=0; k.forEach((c,i)=>{ s+=H(c); if(i)s+=GY; }); n.__sh=Math.max(n.__h,s); return n.__sh; };
    const rootH=H(L.tree);
    const place=(n,top)=>{ const x=dx[n.__d]; n.__x=x; n.__y=top+(n.__sh-n.__h)/2;
      n.__el.style.transform='translate('+n.__x+'px,'+n.__y+'px)';
      n.__el.__x=n.__x; n.__el.__y=n.__y; n.__el.__w=n.__w; n.__el.__h=n.__h;
      const k=n.__vis; if(k.length){ let sum=0; k.forEach((c,i)=>{sum+=c.__sh; if(i)sum+=GY;});
        let cy=top+(n.__sh-sum)/2; k.forEach(c=>{ place(c,cy); cy+=c.__sh+GY; }); } };
    place(L.tree, PAD);

    let maxX=0,maxY=0;
    items.forEach(({n})=>{ maxX=Math.max(maxX,n.__x+n.__w); maxY=Math.max(maxY,n.__y+n.__h); });
    stage.style.width=(maxX+PAD)+'px'; stage.style.height=(maxY+PAD)+'px';
    nodesEl.style.width=(maxX+PAD)+'px'; nodesEl.style.height=(maxY+PAD)+'px';
    edgesEl.setAttribute('width',maxX+PAD); edgesEl.setAttribute('height',maxY+PAD);

    /* 4) 树边 */
    let svg='';
    items.forEach(({n})=>{ (n.__vis||[]).forEach(c=>{

      svg+='<path d="M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2+'" fill="none" '+
           'stroke="'+edgeColor(c.k)+'" stroke-width="1.5" opacity=".85"/>';
    }); });

    /* 5) 推导链叠加边 */
    S.pos={};
    if(S.links && L.chains){
      L.chains.forEach((ch,i)=>{
        const a=findNode(L.tree,ch.a), b=findNode(L.tree,ch.b);
        const va = a && a.__el && a.__el.parentNode && a.__x!==undefined && PATH.has(a.__id) && a.__el.offsetParent!==null;
        const vb = b && b.__el && b.__el.parentNode && b.__x!==undefined && b.__el.offsetParent!==null;
        if(a&&b&&a.__el&&b.__el&&a.__x!==undefined&&b.__x!==undefined){
          const x1=a.__x+a.__w, y1=a.__y+a.__h/2, x2=b.__x, y2=b.__y+b.__h/2;
          const dy=y2-y1, bow=30+18*Math.min(3,Math.abs(dy)/160);

          svg+='<g class="cl" data-i="'+i+'" style="cursor:pointer">'+
               '<path d="'+d+'" fill="none" stroke="'+ '#ea580c' +'" stroke-width="2" stroke-dasharray="6 4" opacity=".72" marker-end="url(#ar)"/>'+
               '<circle cx="'+((x1+x2)/2)+'" cy="'+((y1+y2)/2 - (i%2?16:-16))+'" r="9.5" fill="#ea580c"/>'+
               '<text x="'+((x1+x2)/2)+'" y="'+((y1+y2)/2 - (i%2?16:-16)+3.6)+'" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">'+(i+1)+'</text>'+
               '</g>';
          S.pos[ch.a]=a; S.pos[ch.b]=b;
        }
      });
    }
    edgesEl.innerHTML='<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" '+
      'markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs>'+svg;
    edgesEl.querySelectorAll('.cl').forEach(g=>{
      g.addEventListener('click',()=>{ focusChain(BY_ID[S.cur], +g.dataset.i); });
    });

    fitView(!!force);
  };

  const done = Promise.all([typeset([$('#head'), $('#panels')]), cachedTypeset(wrap, me)]).then(()=>{ if(me===RENDER_ID && S.cur===L.id) drawLayout(true); });
  done.then(()=>{ if(me===RENDER_ID && S.cur===L.id) setTimeout(()=>drawLayout(false),0); });
  showWarn();

}
function focusChain(L, i){
  const c=(L.chains||[])[i]; if(!c) return;
  buildPath(L.tree);
  const targets=[];
  [c.a,c.b].forEach(term=>{
    const n=findNode(L.tree, term); if(!n) return;
    let cur=n; const chain=[];
    while(cur){ chain.push(cur.__id); cur=parentOf(cur); }
    chain.forEach(id=>S.collapsed.delete(S.cur+'::'+id));
    n.__flash=true; targets.push(n);
  });
  if(!targets.length) return;
  const saveDepth=S.depth; S.depth=9;
  render().then(()=>{
    S.depth=saveDepth;
    const fl=[...nodesEl.querySelectorAll('.node')].filter(e=>e.dataset.flash==='1');
    if(fl.length){
      fl.forEach(e=>{e.classList.add('flash'); setTimeout(()=>e.classList.remove('flash'),2600);});

    }
    document.querySelectorAll('#panels .chain').forEach(el=>{
      if(+el.dataset.i===i){ el.style.background='#fed7aa'; setTimeout(()=>el.style.background='',900); }
    });
  });
}

function applyT(){
  stage.style.transform='scale('+S.scale+')';

  sc.style.width=Math.max(sw*S.scale,1)+'px'; sc.style.height=Math.max(sh*S.scale,1)+'px';

function centerOn(x,y){ if(!isFinite(x)||!isFinite(y)) return; wrap.scrollLeft=Math.max(0,x*S.scale-wrap.clientWidth*0.36); wrap.scrollTop=Math.max(0,y*S.scale-wrap.clientHeight*0.42); }
function fitView(force){
  const w=wrap.clientWidth-( $('#panels').style.display==='block'?418:40 );

  const cx=(wrap.scrollLeft+mx)/S.scale, cy=(wrap.scrollTop+my)/S.scale;
  const ns=Math.min(2.2, Math.max(.3, S.scale*Math.exp(-e.deltaY*0.0012)));

function focusNode(term){
  const L=BY_ID[S.cur]; buildPath(L.tree);
  const t=findNode(L.tree, term); if(!t) return false;
  let cur=t; const chain=[];
  while(cur){ chain.push(cur.__id); cur=parentOf(cur); }
  chain.forEach(id=>S.collapsed.delete(S.cur+'::'+id));
  const want=t.__id; t.__flash=true;
  const saveDepth=S.depth; S.depth=Math.max(S.depth, depthOf(L.tree, want)+1);

/* ================= 按钮 ================= */
$('#b-expand').onclick=()=>{S.collapsed.clear();S.depth=9;$('#b-depth').value='9';render();};
$('#b-collapse').onclick=()=>{S.collapsed.clear();buildPath(BY_ID[S.cur].tree);
  walk(BY_ID[S.cur].tree,(n,d)=>{ if(d>=1&&(n.c||[]).length) S.collapsed.add(S.cur+'::'+n.__id); });
  // keep sections open one level
  buildPath(BY_ID[S.cur].tree);
  walk(BY_ID[S.cur].tree,(n,d)=>{ if(d>=2&&(n.c||[]).length) S.collapsed.delete(S.cur+'::'+n.__id); });
  S.depth=3; $('#b-depth').value='3'; render();};
$('#b-depth').onchange=e=>{S.depth=+e.target.value; S.collapsed.clear(); render();};
$('#b-links').onclick=e=>{S.links=!S.links; e.target.classList.toggle('on',S.links); render();};
$('#b-rel').onclick=e=>{S.rel=!S.rel; e.target.classList.toggle('on',S.rel); drawPanels(BY_ID[S.cur]); typeset($('#panels'));};
$('#b-panel').onclick=e=>{S.panel=!S.panel; e.target.classList.toggle('on',S.panel); drawPanels(BY_ID[S.cur]); typeset($('#panels')); fitView(true);};
$('#b-fit').onclick=()=>fitView(true);
$('#b-in').onclick=()=>{S.scale=Math.min(2.2,S.scale*1.15);applyT();};
$('#b-out').onclick=()=>{S.scale=Math.max(.2,S.scale/1.15);applyT();};
$('#b-print').onclick=()=>{S.__fitted=false;fitView(true);setTimeout(()=>window.print(),150);};
$('#gopen').onclick=()=>showGlobal();
function showGlobal(){ S.cur=null; document.querySelectorAll('.lbtn').forEach(b=>b.classList.remove('act'));
  $('#panels').style.display='none'; drawGlobal(); showWarn(); }
window.addEventListener('resize',()=>{ if(S.cur) fitView(true); });
window.addEventListener('keydown',e=>{
  if(e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const k=e.key;
  if(k==='+'||k==='='){S.scale=Math.min(2.2,S.scale*1.15);applyT();}
  else if(k==='-'||k==='_'){S.scale=Math.max(.25,S.scale/1.15);applyT();}
  else if(k==='0'){fitView(true);}
  else if(k==='ArrowLeft'){panBy(90,0);} else if(k==='ArrowRight'){panBy(-90,0);}
  else if(k==='ArrowUp'){panBy(0,90);} else if(k==='ArrowDown'){panBy(0,-90);}
  else if(k==='['){step(-1);} else if(k===']'){step(1);}
});
function step(dir){
  const i=LECTURES.findIndex(l=>l.id===S.cur); const j=(i+dir+LECTURES.length)%LECTURES.length;
  go(LECTURES[j].id);
}

/* ================= 启动 ================= */
(function init(){
  const nav=$('#navlist'); let html='', ch=0;
  LECTURES.forEach(L=>{
    if(L.ch!==ch){ if(ch) html+='</div>'; ch=L.ch; html+='<div class="grp"><div class="gt">'+L.chName+'</div>'; }
    html+='<div class="lbtn" data-id="'+L.id+'" title="'+esc(L.title)+'"><span class="pp">'+L.pages+'p</span><span>'+L.short+'</span></div>';
  });
  nav.innerHTML=html+'</div>';
  nav.querySelectorAll('.lbtn').forEach(b=>b.onclick=()=>go(b.dataset.id));
  if(window.innerWidth<1300){ S.panel=false; $('#b-panel').classList.remove('on'); }
  go(LECTURES[0].id);
})();
</script>
